[package]
name = "worklight"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Manual tracking of user invoked commands with a Ratatui panel"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"

[profile.bench]
inherits = "release"
